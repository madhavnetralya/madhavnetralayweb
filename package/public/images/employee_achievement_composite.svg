<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background Canvas -->
  <rect width="1200" height="600" fill="#f1f5f9"/>

  <!-- LEFT PANEL: PODIUM CEREMONY (600x600) -->
  <g transform="translate(10, 10)">
    <rect width="575" height="580" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Stage Background Canopy -->
    <rect x="25" y="25" width="545" height="300" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
    <path d="M 25 25 L 570 25 L 570 65 L 25 65 Z" fill="#fee2e2"/>
    
    <!-- Event Banner -->
    <rect x="100" y="75" width="395" height="110" fill="#ffffff" stroke="#ef4444" stroke-width="2" rx="6"/>
    <!-- Logo / Emblem on Banner -->
    <circle cx="130" cy="130" r="20" fill="#dc2626" opacity="0.15"/>
    <circle cx="130" cy="130" r="14" fill="#dc2626"/>
    <text x="130" y="134" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">MAA</text>

    <!-- Banner Text -->
    <text x="310" y="98" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle" letter-spacing="0.5">45th MAHARASHTRA STATE CHAMPIONSHIP - 2024</text>
    <text x="310" y="118" font-size="11" font-weight="800" fill="#1e293b" text-anchor="middle">ORGANIZED BY MASTER ATHLETICS ASSOCIATION, NAGPUR</text>
    
    <rect x="160" y="128" width="300" height="20" fill="#ef4444" rx="4"/>
    <text x="310" y="142" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">DATE : 27th TO 29th DECEMBER</text>
    
    <text x="310" y="166" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">VENUE : RTM NAGPUR UNIVERSITY, RAVI NAGAR, AMRAVATI ROAD, NAGPUR</text>

    <!-- Trophies on Background Table -->
    <rect x="440" y="210" width="80" height="25" fill="#e2e8f0" rx="3"/>
    <!-- Trophy 1 -->
    <path d="M 455 210 L 465 185 L 475 210 Z" fill="#eab308"/>
    <rect x="462" y="210" width="6" height="10" fill="#ca8a04"/>
    <!-- Trophy 2 -->
    <path d="M 490 210 L 500 180 L 510 210 Z" fill="#eab308"/>
    <rect x="497" y="210" width="6" height="10" fill="#ca8a04"/>

    <!-- Podium Base -->
    <g transform="translate(45, 340)">
      <!-- Stage Floor -->
      <rect x="0" y="180" width="500" height="40" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Podium #2 (Left) -->
      <rect x="40" y="90" width="110" height="90" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
      <rect x="40" y="90" width="110" height="20" fill="#fee2e2"/>
      <text x="95" y="150" font-size="42" font-weight="900" fill="#dc2626" text-anchor="middle">2</text>

      <!-- Podium #1 (Center - Gold - Ms. Alka Pandey) -->
      <rect x="170" y="40" width="150" height="140" fill="#ffffff" stroke="#dc2626" stroke-width="4"/>
      <rect x="170" y="40" width="150" height="25" fill="#fee2e2"/>
      <text x="245" y="130" font-size="64" font-weight="900" fill="#dc2626" text-anchor="middle">1</text>

      <!-- Podium #3 (Right) -->
      <rect x="340" y="110" width="100" height="70" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
      <rect x="340" y="110" width="100" height="20" fill="#fee2e2"/>
      <text x="390" y="160" font-size="36" font-weight="900" fill="#dc2626" text-anchor="middle">3</text>

      <!-- FIGURES / ATHLETES & DIGNITARIES -->
      
      <!-- Dignitary (Left Official presenting award) -->
      <g transform="translate(110, -50)">
        <ellipse cx="25" cy="15" rx="12" ry="14" fill="#fbcfe8"/>
        <path d="M 10 30 Q 25 28 40 30 L 42 100 L 8 100 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <!-- Suit Jacket -->
        <path d="M 8 40 L 25 70 L 42 40 L 45 100 L 5 100 Z" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="25" y="120" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">Official</text>
      </g>

      <!-- Ms. Alka Pandey (Center #1 Podium - Gold Winner) -->
      <g transform="translate(210, -70)">
        <!-- Head -->
        <circle cx="35" cy="15" r="14" fill="#fde047"/>
        <path d="M 20 12 C 20 0, 50 0, 50 12 C 50 25, 20 25, 20 12 Z" fill="#1e293b"/>
        <!-- Glasses -->
        <rect x="26" y="12" width="8" height="6" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>
        <rect x="36" y="12" width="8" height="6" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>
        
        <!-- India Sports Tracksuit / Outfit -->
        <path d="M 15 32 Q 35 28 55 32 L 52 80 L 18 80 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
        <!-- Tricolor Accent on Jacket -->
        <rect x="22" y="40" width="26" height="4" fill="#f97316"/>
        <rect x="22" y="44" width="26" height="4" fill="#ffffff"/>
        <rect x="22" y="48" width="26" height="4" fill="#16a34a"/>
        <!-- India Emblem / Logo -->
        <circle cx="35" cy="60" r="5" fill="#1d4ed8"/>

        <!-- Gold Medal & Ribbon around neck -->
        <path d="M 28 30 L 35 52 L 42 30" fill="none" stroke="#dc2626" stroke-width="3"/>
        <circle cx="35" cy="55" r="7" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
        <text x="35" y="58" font-size="8" font-weight="bold" fill="#78350f" text-anchor="middle">1</text>

        <!-- Shorts / Leggings -->
        <rect x="20" y="80" width="14" height="30" fill="#0f172a" rx="3"/>
        <rect x="36" y="80" width="14" height="30" fill="#0f172a" rx="3"/>
        <!-- Knee Supports / Shoes -->
        <rect x="20" y="102" width="14" height="8" fill="#475569"/>
        <rect x="36" y="102" width="14" height="8" fill="#475569"/>

        <!-- Label -->
        <rect x="-10" y="115" width="90" height="18" fill="#fef08a" stroke="#ca8a04" rx="4"/>
        <text x="35" y="128" font-size="10" font-weight="900" fill="#854d0e" text-anchor="middle">Ms. Alka Pandey (Gold)</text>
      </g>

      <!-- Runner Up 2 (Left Podium) -->
      <g transform="translate(65, -15)">
        <circle cx="30" cy="15" r="12" fill="#fbcfe8"/>
        <path d="M 15 30 L 45 30 L 42 85 L 18 85 Z" fill="#1d4ed8"/>
        <circle cx="30" cy="45" r="5" fill="#94a3b8"/>
      </g>

      <!-- Runner Up 3 (Right Podium holding certificate) -->
      <g transform="translate(360, 5)">
        <circle cx="30" cy="15" r="12" fill="#fbcfe8"/>
        <path d="M 15 30 L 45 30 L 42 80 L 18 80 Z" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
        <!-- Holding Chest Number 552 -->
        <rect x="20" y="45" width="20" height="15" fill="#ffffff" stroke="#000"/>
        <text x="30" y="56" font-size="8" font-weight="bold" fill="#000" text-anchor="middle">552</text>
      </g>

    </g>

    <!-- Caption -->
    <rect x="25" y="535" width="545" height="35" fill="#1e293b" rx="8"/>
    <text x="297" y="557" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">🏆 1st Place Gold Medal Ceremony — 45th Maharashtra State Championship 2024</text>
  </g>

  <!-- RIGHT PANEL: STAGE CERTIFICATE PRESENTATION (600x600) -->
  <g transform="translate(595, 10)">
    <rect width="595" height="580" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Stage Background Banner -->
    <rect x="20" y="25" width="555" height="280" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
    <rect x="20" y="25" width="555" height="40" fill="#1e3a8a"/>
    <text x="297" y="50" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">MASTER ATHLETICS ASSOCIATION, NAGPUR</text>

    <!-- Stage Backdrop Banner Details -->
    <rect x="60" y="75" width="475" height="95" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
    <text x="297" y="98" font-size="13" font-weight="900" fill="#1e40af" text-anchor="middle">45th MAHARASHTRA STATE CHAMPIONSHIP - 2024</text>
    <text x="297" y="118" font-size="10" font-weight="800" fill="#0f172a" text-anchor="middle">VENUE : RTM NAGPUR UNIVERSITY, RAVI NAGAR, NAGPUR</text>
    <rect x="180" y="128" width="235" height="18" fill="#2563eb" rx="3"/>
    <text x="297" y="141" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">DATE : 27th TO 29th DECEMBER</text>

    <!-- Trophy Table on Stage Background -->
    <rect x="450" y="165" width="100" height="55" fill="#e2e8f0" stroke="#cbd5e1" rx="4"/>
    <path d="M 470 165 L 480 135 L 490 165 Z" fill="#eab308"/>
    <path d="M 510 165 L 520 130 L 530 165 Z" fill="#eab308"/>
    <text x="500" y="180" font-size="8" font-weight="bold" fill="#475569" text-anchor="middle">Trophies</text>

    <!-- Stage Floor -->
    <rect x="20" y="305" width="555" height="220" fill="#ef4444" opacity="0.85"/>
    <rect x="20" y="515" width="555" height="10" fill="#b91c1c"/>

    <!-- STAGE PRESENTATION GROUP -->
    
    <!-- Dignitary 1 (Presenter in white shirt & black trousers) -->
    <g transform="translate(100, 200)">
      <circle cx="25" cy="18" r="14" fill="#fbcfe8"/>
      <!-- Glasses & Hair -->
      <path d="M 12 12 C 12 0, 38 0, 38 12 Z" fill="#0f172a"/>
      <rect x="18" y="16" width="14" height="6" fill="#000" rx="1"/>
      <!-- Shirt -->
      <path d="M 8 35 L 42 35 L 45 120 L 5 120 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Trousers -->
      <rect x="8" y="120" width="15" height="130" fill="#1e293b"/>
      <rect x="25" y="120" width="15" height="130" fill="#1e293b"/>
      
      <!-- Presenting Certificate Frame -->
      <rect x="35" y="45" width="90" height="65" fill="#ffffff" stroke="#ca8a04" stroke-width="3" rx="3"/>
      <rect x="40" y="50" width="80" height="55" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
      <text x="80" y="68" font-size="7" font-weight="900" fill="#b91c1c" text-anchor="middle">CERTIFICATE OF ACHIEVEMENT</text>
      <text x="80" y="80" font-size="6" font-weight="bold" fill="#1e293b" text-anchor="middle">45th Maharashtra State Athletic Champ 2024</text>
      <text x="80" y="92" font-size="7" font-weight="900" fill="#15803d" text-anchor="middle">AWARDED TO: MS. ALKA PANDEY</text>
    </g>

    <!-- Ms. Alka Pandey (Winner proudly holding Certificate) -->
    <g transform="translate(250, 180)">
      <!-- Head -->
      <circle cx="35" cy="18" r="14" fill="#fde047"/>
      <path d="M 20 14 C 20 2, 50 2, 50 14 Z" fill="#1e293b"/>
      <rect x="26" y="14" width="8" height="6" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>
      <rect x="36" y="14" width="8" height="6" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>

      <!-- India Track Jacket -->
      <path d="M 12 36 L 58 36 L 52 110 L 18 110 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <!-- Tricolor Stripes -->
      <rect x="20" y="45" width="30" height="4" fill="#f97316"/>
      <rect x="20" y="49" width="30" height="4" fill="#ffffff"/>
      <rect x="20" y="53" width="30" height="4" fill="#16a34a"/>
      <!-- India Logo -->
      <circle cx="35" cy="65" r="5" fill="#1d4ed8"/>

      <!-- Gold Medal around neck -->
      <path d="M 28 36 L 35 60 L 42 36" fill="none" stroke="#dc2626" stroke-width="3"/>
      <circle cx="35" cy="63" r="8" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>

      <!-- Track Pants -->
      <rect x="18" y="110" width="15" height="140" fill="#0f172a"/>
      <rect x="37" y="110" width="15" height="140" fill="#0f172a"/>
      <!-- Side Stripes -->
      <line x1="19" y1="110" x2="19" y2="250" stroke="#0284c7" stroke-width="2"/>
      <line x1="51" y1="110" x2="51" y2="250" stroke="#0284c7" stroke-width="2"/>

      <!-- Label -->
      <rect x="-15" y="255" width="100" height="20" fill="#fef08a" stroke="#ca8a04" rx="4"/>
      <text x="35" y="269" font-size="10" font-weight="900" fill="#854d0e" text-anchor="middle">Ms. Alka Pandey</text>
    </g>

    <!-- Co-Winners / Dignitaries on Stage -->
    <g transform="translate(420, 180)">
      <circle cx="25" cy="18" r="14" fill="#fbcfe8"/>
      <path d="M 8 36 L 42 36 L 45 110 L 5 110 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
      <rect x="8" y="110" width="15" height="140" fill="#1e1b4b"/>
      <rect x="25" y="110" width="15" height="140" fill="#1e1b4b"/>
      
      <!-- Holding Certificate -->
      <rect x="-15" y="55" width="50" height="40" fill="#ffffff" stroke="#2563eb" stroke-width="2" rx="2"/>
      <text x="10" y="75" font-size="6" font-weight="bold" fill="#1e40af" text-anchor="middle">Certificate</text>
    </g>

    <!-- Caption -->
    <rect x="25" y="535" width="545" height="35" fill="#1e293b" rx="8"/>
    <text x="297" y="557" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">📜 Official Certificate of Achievement Presentation on Stage</text>
  </g>
</svg>
