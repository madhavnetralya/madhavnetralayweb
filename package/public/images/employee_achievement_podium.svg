<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" font-family="system-ui, -apple-system, sans-serif">
  <rect width="600" height="450" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Backdrop Canopy -->
  <path d="M 20 20 L 580 20 L 580 50 L 20 50 Z" fill="#fee2e2"/>
  
  <!-- Event Banner -->
  <rect x="50" y="55" width="500" height="110" fill="#ffffff" stroke="#ef4444" stroke-width="2" rx="8"/>
  <circle cx="85" cy="110" r="18" fill="#dc2626"/>
  <text x="85" y="115" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">MAA</text>

  <text x="310" y="82" font-size="15" font-weight="900" fill="#b91c1c" text-anchor="middle" letter-spacing="0.5">45th MAHARASHTRA STATE CHAMPIONSHIP - 2024</text>
  <text x="310" y="102" font-size="11" font-weight="800" fill="#1e293b" text-anchor="middle">ORGANIZED BY MASTER ATHLETICS ASSOCIATION, NAGPUR</text>
  
  <rect x="150" y="112" width="320" height="20" fill="#ef4444" rx="4"/>
  <text x="310" y="126" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">DATE : 27th TO 29th DECEMBER</text>
  
  <text x="310" y="150" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">VENUE : RTM NAGPUR UNIVERSITY, RAVI NAGAR, AMRAVATI ROAD, NAGPUR</text>

  <!-- Trophies Table -->
  <rect x="470" y="180" width="85" height="30" fill="#e2e8f0" rx="4"/>
  <path d="M 485 180 L 495 155 L 505 180 Z" fill="#eab308"/>
  <path d="M 520 180 L 530 150 L 540 180 Z" fill="#eab308"/>

  <!-- Podium Base -->
  <g transform="translate(45, 230)">
    <!-- Stage Floor -->
    <rect x="0" y="140" width="510" height="30" fill="#cbd5e1"/>

    <!-- Podium #2 -->
    <rect x="40" y="60" width="110" height="80" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <rect x="40" y="60" width="110" height="18" fill="#fee2e2"/>
    <text x="95" y="115" font-size="36" font-weight="900" fill="#dc2626" text-anchor="middle">2</text>

    <!-- Podium #1 (Gold - Ms. Alka Pandey) -->
    <rect x="170" y="20" width="160" height="120" fill="#ffffff" stroke="#dc2626" stroke-width="4"/>
    <rect x="170" y="20" width="160" height="22" fill="#fee2e2"/>
    <text x="250" y="95" font-size="54" font-weight="900" fill="#dc2626" text-anchor="middle">1</text>

    <!-- Podium #3 -->
    <rect x="350" y="80" width="100" height="60" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <rect x="350" y="80" width="100" height="18" fill="#fee2e2"/>
    <text x="400" y="125" font-size="32" font-weight="900" fill="#dc2626" text-anchor="middle">3</text>

    <!-- Official Presenting Gold Medal -->
    <g transform="translate(100, -55)">
      <circle cx="25" cy="15" r="13" fill="#fbcfe8"/>
      <path d="M 10 30 Q 25 28 40 30 L 42 95 L 8 95 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M 8 38 L 25 65 L 42 38 L 45 95 L 5 95 Z" fill="#f1f5f9" stroke="#cbd5e1"/>
    </g>

    <!-- Ms. Alka Pandey on #1 Podium receiving Gold Medal -->
    <g transform="translate(215, -80)">
      <!-- Head & Glasses -->
      <circle cx="35" cy="15" r="14" fill="#fde047"/>
      <path d="M 20 12 C 20 0, 50 0, 50 12 Z" fill="#1e293b"/>
      <rect x="26" y="12" width="8" height="6" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>
      <rect x="36" y="12" width="8" height="6" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>
      
      <!-- India Sports Outfit -->
      <path d="M 15 32 Q 35 28 55 32 L 52 80 L 18 80 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <rect x="22" y="40" width="26" height="4" fill="#f97316"/>
      <rect x="22" y="44" width="26" height="4" fill="#ffffff"/>
      <rect x="22" y="48" width="26" height="4" fill="#16a34a"/>

      <!-- Gold Medal & Ribbon -->
      <path d="M 28 30 L 35 52 L 42 30" fill="none" stroke="#dc2626" stroke-width="3"/>
      <circle cx="35" cy="55" r="7" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="35" y="58" font-size="8" font-weight="bold" fill="#78350f" text-anchor="middle">1</text>

      <rect x="20" y="80" width="14" height="22" fill="#0f172a" rx="2"/>
      <rect x="36" y="80" width="14" height="22" fill="#0f172a" rx="2"/>

      <rect x="-15" y="105" width="100" height="18" fill="#fef08a" stroke="#ca8a04" rx="4"/>
      <text x="35" y="118" font-size="10" font-weight="900" fill="#854d0e" text-anchor="middle">Ms. Alka Pandey (Gold)</text>
    </g>

    <!-- Co-Competitors -->
    <g transform="translate(65, -25)">
      <circle cx="30" cy="15" r="12" fill="#fbcfe8"/>
      <path d="M 15 30 L 45 30 L 42 85 L 18 85 Z" fill="#1d4ed8"/>
    </g>
    <g transform="translate(370, -5)">
      <circle cx="30" cy="15" r="12" fill="#fbcfe8"/>
      <path d="M 15 30 L 45 30 L 42 85 L 18 85 Z" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
      <rect x="20" y="45" width="20" height="15" fill="#ffffff" stroke="#000"/>
      <text x="30" y="56" font-size="8" font-weight="bold" fill="#000" text-anchor="middle">552</text>
    </g>
  </g>

  <!-- Title Footer -->
  <rect x="20" y="405" width="560" height="30" fill="#0f172a" rx="6"/>
  <text x="300" y="425" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">🏆 Podium Gold Medal Ceremony — Ms. Alka Pandey (1st Place)</text>
</svg>
