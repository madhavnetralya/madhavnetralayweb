<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f1eddf"/>
    </linearGradient>
    <linearGradient id="chairYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="whiteCoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="redCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Room -->
  <rect width="800" height="650" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Back Wall & Window Light -->
  <path d="M 0 0 L 800 0 L 800 480 L 0 480 Z" fill="#faf5eb"/>
  <rect x="50" y="30" width="180" height="150" fill="#fef08a" opacity="0.3" rx="8"/>
  <line x1="140" y1="30" x2="140" y2="180" stroke="#fef08a" stroke-width="3"/>
  <line x1="50" y1="105" x2="230" y2="105" stroke="#fef08a" stroke-width="3"/>
  
  <!-- Floor -->
  <path d="M 0 480 L 800 480 L 800 650 L 0 650 Z" fill="#84cc16" opacity="0.65"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#65a30d" stroke-width="4"/>

  <!-- Background Teacher / Organizer (Woman in Saree) -->
  <g transform="translate(480, 40)">
    <!-- Saree Body -->
    <path d="M 40 100 Q 80 80 120 100 L 130 380 L 30 380 Z" fill="#f97316"/>
    <path d="M 60 100 Q 90 140 120 220 L 100 380 L 40 380 Z" fill="#eab308"/>
    <!-- Head -->
    <circle cx="80" cy="50" r="24" fill="#d97706"/>
    <!-- Hair -->
    <path d="M 56 45 C 56 20, 104 20, 104 45 C 104 25, 56 25, 56 45 Z" fill="#1e293b"/>
    <!-- Glasses -->
    <circle cx="72" cy="48" r="6" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="88" cy="48" r="6" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="78" y1="48" x2="82" y2="48" stroke="#000" stroke-width="1.5"/>
    <!-- Arm Pointing -->
    <path d="M 60 120 L 10 100 L -15 110" fill="none" stroke="#d97706" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Table with Red Ophthalmic Trial Lens Cases -->
  <g transform="translate(320, 240)">
    <!-- Table Body -->
    <rect x="0" y="80" width="440" height="150" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <rect x="0" y="80" width="440" height="20" fill="#e2e8f0"/>
    
    <!-- Red Velvet Trial Lens Box 1 (Left) -->
    <rect x="40" y="-10" width="110" height="90" fill="url(#redCase)" rx="6" stroke="#991b1b" stroke-width="3"/>
    <rect x="48" y="-2" width="94" height="74" fill="#991b1b" rx="4"/>
    <!-- Trial Lenses Grid -->
    <circle cx="65" cy="15" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <circle cx="85" cy="15" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <circle cx="105" cy="15" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <circle cx="125" cy="15" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <circle cx="65" cy="35" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <circle cx="85" cy="35" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <circle cx="105" cy="35" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <circle cx="125" cy="35" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>

    <!-- Red Velvet Trial Lens Box 2 (Right - Larger Open Case) -->
    <rect x="230" y="-30" width="180" height="110" fill="url(#redCase)" rx="8" stroke="#991b1b" stroke-width="3"/>
    <rect x="240" y="-20" width="160" height="90" fill="#7f1d1d" rx="4"/>
    <!-- Instruments inside case -->
    <rect x="255" y="-5" width="60" height="12" fill="#0284c7" rx="3"/>
    <rect x="325" y="-5" width="60" height="12" fill="#0284c7" rx="3"/>
    <rect x="255" y="15" width="130" height="10" fill="#0f172a" rx="2"/>
    <rect x="255" y="32" width="130" height="10" fill="#0f172a" rx="2"/>
    <rect x="255" y="49" width="130" height="10" fill="#0f172a" rx="2"/>
  </g>

  <!-- Yellow Draped Chairs -->
  <!-- Chair 1 (Far Left) -->
  <path d="M 40 310 Q 90 280 140 310 L 150 560 L 30 560 Z" fill="url(#chairYellow)" filter="url(#shadow)"/>
  <!-- Chair 2 (Middle Left) -->
  <path d="M 180 380 Q 230 350 280 380 L 290 600 L 170 600 Z" fill="url(#chairYellow)" filter="url(#shadow)"/>
  <!-- Chair 3 (Middle Right) -->
  <path d="M 370 380 Q 420 350 470 380 L 480 610 L 360 610 Z" fill="url(#chairYellow)" filter="url(#shadow)"/>

  <!-- LEFT DOCTOR (Optometrist presenting eye model to girl) -->
  <g transform="translate(10, 240)">
    <!-- Hair & Head -->
    <circle cx="80" cy="40" r="22" fill="#b45309"/>
    <path d="M 60 35 C 60 10, 100 10, 100 35 Z" fill="#1e293b"/>
    <!-- Pink Saree Underneath -->
    <path d="M 40 80 Q 80 60 120 80 L 160 320 L 20 320 Z" fill="#ec4899"/>
    <!-- White Doctor Coat -->
    <path d="M 35 75 Q 80 65 125 75 L 145 280 L 25 280 Z" fill="url(#whiteCoat)" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 70 75 L 80 160 L 90 75" fill="none" stroke="#ec4899" stroke-width="3"/>
    <!-- ID Card Lanyard -->
    <path d="M 68 75 L 80 130 L 92 75" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="74" y="130" width="12" height="16" fill="#fef08a" stroke="#ca8a04" rx="2"/>

    <!-- Hand holding Eye Anatomy Model -->
    <path d="M 110 130 L 150 145" stroke="#b45309" stroke-width="12" stroke-linecap="round"/>
    <!-- Eye Model (Blue sphere with red cornea) -->
    <circle cx="165" cy="148" r="14" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <circle cx="160" cy="148" r="8" fill="#ef4444"/>
    <circle cx="158" cy="148" r="3" fill="#ffffff"/>
  </g>

  <!-- STUDENT 1 (Schoolgirl on Left receiving eye model demo) -->
  <g transform="translate(140, 310)">
    <!-- Head -->
    <circle cx="70" cy="40" r="18" fill="#d97706"/>
    <!-- Hair Bun / Ponytail -->
    <circle cx="88" cy="35" r="10" fill="#0f172a"/>
    <!-- School Uniform (Blue Shirt + Dark Skirt) -->
    <path d="M 45 70 L 95 70 L 105 160 L 35 160 Z" fill="#38bdf8"/>
    <path d="M 40 160 L 100 160 L 110 240 L 30 240 Z" fill="#1e3a8a"/>
    <rect x="42" y="240" width="12" height="50" fill="#d97706"/>
    <rect x="78" y="240" width="12" height="50" fill="#d97706"/>
    <rect x="38" y="285" width="20" height="10" fill="#0f172a" rx="2"/>
    <rect x="74" y="285" width="20" height="10" fill="#0f172a" rx="2"/>
  </g>

  <!-- STUDENT 2 (Schoolgirl in Center undergoing eye examination) -->
  <g transform="translate(340, 340)">
    <!-- Head looking forward -->
    <circle cx="65" cy="35" r="18" fill="#d97706"/>
    <path d="M 48 30 C 48 10, 82 10, 82 30 Z" fill="#0f172a"/>
    <!-- School Uniform (Checkered Pinafore Dress) -->
    <path d="M 40 65 L 90 65 L 100 160 L 30 160 Z" fill="#fef08a"/>
    <path d="M 42 85 L 88 85 L 98 170 L 32 170 Z" fill="#b91c1c"/>
    <!-- Checkered Lines -->
    <line x1="50" y1="85" x2="50" y2="170" stroke="#facc15" stroke-width="2"/>
    <line x1="70" y1="85" x2="70" y2="170" stroke="#facc15" stroke-width="2"/>
    <line x1="40" y1="110" x2="95" y2="110" stroke="#facc15" stroke-width="2"/>
    <line x1="35" y1="140" x2="98" y2="140" stroke="#facc15" stroke-width="2"/>
    <!-- School ID Tag -->
    <rect x="58" y="100" width="14" height="18" fill="#ffffff" stroke="#991b1b" rx="2"/>
    <!-- Legs & Shoes -->
    <rect x="42" y="170" width="12" height="60" fill="#d97706"/>
    <rect x="70" y="170" width="12" height="60" fill="#d97706"/>
    <!-- Socks -->
    <rect x="40" y="200" width="16" height="20" fill="#ffffff"/>
    <rect x="68" y="200" width="16" height="20" fill="#ffffff"/>
    <rect x="38" y="225" width="20" height="10" fill="#0f172a" rx="2"/>
    <rect x="66" y="225" width="20" height="10" fill="#0f172a" rx="2"/>
  </g>

  <!-- RIGHT DOCTOR (Optometrist with retinoscope conducting eye exam) -->
  <g transform="translate(520, 320)">
    <!-- Head & Long Braided Hair -->
    <circle cx="80" cy="35" r="22" fill="#b45309"/>
    <path d="M 60 30 C 60 5, 100 5, 100 30 Z" fill="#0f172a"/>
    <!-- Braid hanging over shoulder -->
    <path d="M 95 35 Q 120 100 145 180" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>

    <!-- Green Saree Underneath -->
    <path d="M 40 75 Q 80 55 120 75 L 160 300 L 20 300 Z" fill="#15803d"/>
    <!-- White Doctor Coat -->
    <path d="M 35 70 Q 80 60 125 70 L 145 270 L 25 270 Z" fill="url(#whiteCoat)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Green Saree Sleeve Border -->
    <rect x="22" y="130" width="20" height="8" fill="#15803d"/>

    <!-- Hand Holding Ophthalmic Torch / Retinoscope -->
    <path d="M 45 130 L -10 115" stroke="#b45309" stroke-width="10" stroke-linecap="round"/>
    <!-- Blue Handheld Instrument -->
    <rect x="-30" y="100" width="14" height="35" fill="#0284c7" rx="3" transform="rotate(-15)"/>
    <circle cx="-25" cy="98" r="6" fill="#fef08a"/>
    <!-- Light Beam aimed at student -->
    <path d="M -30 98 L -110 105 L -110 125 Z" fill="#fef08a" opacity="0.45"/>
  </g>

  <!-- Section Title Badge Overlay at Bottom -->
  <rect x="20" y="585" width="760" height="48" fill="#0f172a" rx="12" filter="url(#shadow)"/>
  <text x="400" y="614" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    🏫 Madhav Netralaya — Pediatric &amp; School Community Eye Screening Camp
  </text>
</svg>
