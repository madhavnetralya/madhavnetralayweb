<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" font-family="system-ui, -apple-system, sans-serif">
  <rect width="600" height="450" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Stage Backdrop Banner -->
  <rect x="20" y="20" width="560" height="230" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <rect x="20" y="20" width="560" height="35" fill="#1e3a8a"/>
  <text x="300" y="42" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">MASTER ATHLETICS ASSOCIATION, NAGPUR</text>

  <!-- Banner Details -->
  <rect x="60" y="65" width="480" height="85" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="300" y="88" font-size="13" font-weight="900" fill="#1e40af" text-anchor="middle">45th MAHARASHTRA STATE CHAMPIONSHIP - 2024</text>
  <text x="300" y="106" font-size="10" font-weight="800" fill="#0f172a" text-anchor="middle">VENUE : RTM NAGPUR UNIVERSITY, RAVI NAGAR, NAGPUR</text>
  <rect x="180" y="115" width="240" height="18" fill="#2563eb" rx="3"/>
  <text x="300" y="128" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">DATE : 27th TO 29th DECEMBER</text>

  <!-- Stage Trophies -->
  <rect x="465" y="155" width="90" height="45" fill="#e2e8f0" rx="4"/>
  <path d="M 480 155 L 490 125 L 500 155 Z" fill="#eab308"/>
  <path d="M 520 155 L 530 120 L 540 155 Z" fill="#eab308"/>

  <!-- Red Stage Floor -->
  <rect x="20" y="250" width="560" height="145" fill="#ef4444"/>

  <!-- PRESENTATION GROUP ON STAGE -->
  <!-- Presenter 1 -->
  <g transform="translate(90, 150)">
    <circle cx="25" cy="18" r="14" fill="#fbcfe8"/>
    <path d="M 12 12 C 12 0, 38 0, 38 12 Z" fill="#0f172a"/>
    <rect x="18" y="16" width="14" height="6" fill="#000" rx="1"/>
    <path d="M 8 35 L 42 35 L 45 120 L 5 120 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="8" y="120" width="15" height="110" fill="#1e293b"/>
    <rect x="25" y="120" width="15" height="110" fill="#1e293b"/>
    
    <!-- Presenting Achievement Certificate -->
    <rect x="35" y="45" width="95" height="70" fill="#ffffff" stroke="#ca8a04" stroke-width="3" rx="3"/>
    <rect x="40" y="50" width="85" height="60" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
    <text x="82" y="68" font-size="7" font-weight="900" fill="#b91c1c" text-anchor="middle">CERTIFICATE OF ACHIEVEMENT</text>
    <text x="82" y="80" font-size="6" font-weight="bold" fill="#1e293b" text-anchor="middle">45th Maharashtra State Athletic Champ 2024</text>
    <text x="82" y="94" font-size="7" font-weight="900" fill="#15803d" text-anchor="middle">AWARDED TO: MS. ALKA PANDEY</text>
  </g>

  <!-- Ms. Alka Pandey on Stage -->
  <g transform="translate(250, 135)">
    <circle cx="35" cy="18" r="14" fill="#fde047"/>
    <path d="M 20 14 C 20 2, 50 2, 50 14 Z" fill="#1e293b"/>
    <rect x="26" y="14" width="8" height="6" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>
    <rect x="36" y="14" width="8" height="6" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>

    <!-- Track Jacket -->
    <path d="M 12 36 L 58 36 L 52 110 L 18 110 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="20" y="45" width="30" height="4" fill="#f97316"/>
    <rect x="20" y="49" width="30" height="4" fill="#ffffff"/>
    <rect x="20" y="53" width="30" height="4" fill="#16a34a"/>

    <!-- Gold Medal -->
    <path d="M 28 36 L 35 60 L 42 36" fill="none" stroke="#dc2626" stroke-width="3"/>
    <circle cx="35" cy="63" r="8" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>

    <!-- Track Pants -->
    <rect x="18" y="110" width="15" height="120" fill="#0f172a"/>
    <rect x="37" y="110" width="15" height="120" fill="#0f172a"/>

    <rect x="-15" y="235" width="100" height="18" fill="#fef08a" stroke="#ca8a04" rx="4"/>
    <text x="35" y="248" font-size="10" font-weight="900" fill="#854d0e" text-anchor="middle">Ms. Alka Pandey</text>
  </g>

  <!-- Co-Winner / Dignitary -->
  <g transform="translate(420, 135)">
    <circle cx="25" cy="18" r="14" fill="#fbcfe8"/>
    <path d="M 8 36 L 42 36 L 45 110 L 5 110 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="8" y="110" width="15" height="120" fill="#1e1b4b"/>
    <rect x="25" y="110" width="15" height="120" fill="#1e1b4b"/>
    <rect x="-15" y="55" width="50" height="40" fill="#ffffff" stroke="#2563eb" stroke-width="2" rx="2"/>
    <text x="10" y="75" font-size="6" font-weight="bold" fill="#1e40af" text-anchor="middle">Certificate</text>
  </g>

  <!-- Title Footer -->
  <rect x="20" y="405" width="560" height="30" fill="#0f172a" rx="6"/>
  <text x="300" y="425" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">📜 Official Certificate of Achievement Presentation on Stage</text>
</svg>
